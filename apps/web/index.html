<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sheepcliff — Luna Farm</title>
    <style>
      /* UI colours are the prototype page's own: #2b1d17 #4e3428 #ffd75e #f6f2e8 and the overlay greens #243a20 #1b2c18 #3d5a38. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #2b1d17;
        color: #f6f2e8;
        font: 13px/1.4 ui-monospace, Menlo, monospace;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 0 0 12px;
      }
      /* Portrait phone first: the scene fills the width, the tray sits below. */
      #stage {
        position: relative;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 640 / 400;
        overflow: hidden;
        background: #5e9a4d;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Native-pixel world canvas, upscaled by CSS only. Never draw scaled. */
      #world {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Full-resolution layer for tags and HUD so text stays sharp. */
      #ui {
        pointer-events: none;
      }
      /* Pin layer: inert until "add pins", then it takes the taps. */
      #pins {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #stage.commenting {
        cursor: crosshair;
      }
      #stage.commenting #pins {
        pointer-events: auto;
      }
      .pin {
        position: absolute;
        transform: translate(-50%, -100%);
        pointer-events: auto;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
        color: #2b1d17;
        background: #ffd75e;
        border: 2px solid #2b1d17;
        border-radius: 12px 12px 12px 2px;
        padding: 1px 6px;
        box-shadow: 0 2px 0 #2b1d17;
      }
      #frozen {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(43, 29, 23, 0.85);
        color: #ffd75e;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 3px;
        pointer-events: none;
      }
      #tray {
        width: 100%;
        max-width: 960px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0 8px;
      }
      /* rows keep their height inside the fixed-height landscape drawer */
      #tray > * {
        flex-shrink: 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      /* creature chips scroll sideways on a narrow phone instead of stacking */
      #who {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: thin;
      }
      button,
      select {
        font: inherit;
        background: #4e3428;
        color: #f6f2e8;
        border: 0;
        padding: 7px 11px;
        min-height: 34px;
        border-radius: 4px;
        white-space: nowrap;
        touch-action: manipulation;
      }
      button.on {
        outline: 2px solid #ffd75e;
      }
      .chip i {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border: 1px solid #2b1d17;
        vertical-align: 0;
      }
      #say {
        min-height: 1.4em;
        opacity: 0.85;
      }
      #say.waiting {
        color: #ffd75e;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .bar .lbl {
        opacity: 0.6;
        margin-right: 2px;
      }
      input[type='range'] {
        width: 140px;
      }
      #notes {
        display: none;
        flex-direction: column;
        gap: 6px;
        background: #243a20;
        border: 2px solid #2b1d17;
        border-radius: 4px;
        padding: 8px;
      }
      #notes.show {
        display: flex;
      }
      .note {
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .note b {
        background: #ffd75e;
        color: #2b1d17;
        border-radius: 10px;
        padding: 0 6px;
        min-width: 18px;
        text-align: center;
      }
      .note textarea {
        flex: 1;
        font: inherit;
        background: #1b2c18;
        color: #f6f2e8;
        border: 1px solid #3d5a38;
        border-radius: 3px;
        padding: 4px;
        min-height: 34px;
        resize: vertical;
        min-width: 0;
      }
      .note .where {
        opacity: 0.7;
        font-size: 12px;
        padding-top: 8px;
      }
      .note button {
        padding: 2px 6px;
        min-height: 0;
      }
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 18, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
      }
      #modal.show {
        display: flex;
      }
      #modalBox {
        background: #243a20;
        border: 2px solid #2b1d17;
        border-radius: 6px;
        max-width: min(94vw, 900px);
        max-height: 90vh;
        overflow: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #modalBox textarea {
        width: 100%;
        min-height: 180px;
        font: inherit;
        background: #1b2c18;
        color: #f6f2e8;
        border: 1px solid #3d5a38;
        border-radius: 3px;
        padding: 6px;
        box-sizing: border-box;
      }
      #modalBox img {
        max-width: 100%;
        image-rendering: pixelated;
        border: 2px solid #2b1d17;
      }
      #modalBox a {
        color: #ffd75e;
      }
      .hint {
        font-size: 12px;
        opacity: 0.8;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
      #trayToggle {
        display: none;
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 30;
        background: rgba(43, 29, 23, 0.92);
      }
      /* Landscape: the scene as big as the screen allows, the tray slides over it from the right. */
      @media (orientation: landscape) {
        main {
          padding: 0;
          gap: 0;
        }
        #stage {
          max-width: none;
          aspect-ratio: auto;
          width: min(100vw, calc(100vh * 1.6));
          height: min(100vh, calc(100vw / 1.6));
        }
        #frozen {
          right: auto;
          left: 8px;
        }
        #trayToggle {
          display: block;
        }
        #tray {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          width: min(400px, 60vw);
          max-width: none;
          overflow-y: auto;
          background: rgba(43, 29, 23, 0.94);
          padding: 46px 10px 10px;
          transform: translateX(100%);
          transition: transform 0.2s;
          z-index: 20;
        }
        body.tray-open #tray {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="stage">
        <canvas id="world" width="640" height="400"></canvas>
        <canvas id="ui"></canvas>
        <div id="pins"></div>
        <div id="frozen" hidden>frozen for pins</div>
      </div>
      <button id="trayToggle" type="button">tray</button>
      <div id="tray">
        <div id="who" class="chips"></div>
        <div id="verbs" class="chips"></div>
        <div id="say">tap a sheep to pet it, Digital Luna to pet her, grass to throw a stick</div>
        <div class="bar">
          <span class="lbl">clock</span>
          <input id="time" type="range" min="0" max="999" value="180" aria-label="time of day" />
          <button id="pause" type="button">pause</button>
        </div>
        <div class="bar">
          <span class="lbl">pins</span>
          <button id="cmode" type="button">add pins</button>
          <button id="cfreeze" type="button">freeze</button>
          <button id="ctext" type="button">show as text</button>
          <button id="cpng" type="button">annotated PNG</button>
          <button id="cclear" type="button">clear</button>
        </div>
        <div id="notes"></div>
        <p id="status">loading art…</p>
      </div>
      <div id="modal"><div id="modalBox"></div></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
